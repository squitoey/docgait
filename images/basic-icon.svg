<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="Walking document logo">
    <title>Walking document</title>
    <!-- ground shadow -->
    <ellipse cx="104" cy="182" rx="46" ry="5" fill="#1F2A44" opacity="0.12"/>

    <!-- motion lines -->
    <g stroke="#3B82F6" stroke-width="5" stroke-linecap="round" opacity="0.7">
        <line x1="22" y1="72" x2="40" y2="72"/>
        <line x1="16" y1="90" x2="38" y2="90"/>
        <line x1="24" y1="108" x2="40" y2="108"/>
    </g>

    <g fill="none" stroke="#1F2A44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <!-- legs -->
        <path d="M90 138 L83 160 L70 174 L80 178"/>
        <path d="M114 138 L122 160 L132 176 L146 176"/>
    </g>

    <!-- body leans forward -->
    <g transform="rotate(6 100 90)">
        <g fill="none" stroke="#1F2A44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <!-- arms (behind body) -->
            <path d="M64 88 L48 104 L40 98"/>
            <path d="M138 88 L156 100 L166 92"/>
        </g>
        <!-- page -->
        <path d="M70 30 H118 L140 52 V132 a8 8 0 0 1 -8 8 H70 a8 8 0 0 1 -8 -8 V38 a8 8 0 0 1 8 -8 Z"
              fill="#FFFFFF" stroke="#1F2A44" stroke-width="6" stroke-linejoin="round"/>
        <!-- folded corner -->
        <path d="M118 30 V46 a6 6 0 0 0 6 6 H140" fill="#E6EEFB" stroke="#1F2A44" stroke-width="6" stroke-linejoin="round"/>
        <!-- text lines -->
        <g stroke="#3B82F6" stroke-width="6" stroke-linecap="round">
            <line x1="76" y1="72" x2="126" y2="72"/>
            <line x1="76" y1="88" x2="126" y2="88"/>
            <line x1="76" y1="104" x2="126" y2="104"/>
            <line x1="76" y1="120" x2="106" y2="120"/>
        </g>
    </g>
</svg>
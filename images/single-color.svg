<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 164 164" width="512" height="512" role="img" aria-label="DocGait icon">
    <title>DocGait</title>
    <g fill="none" stroke="#1F2A44" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <!-- legs -->
        <path d="M90 136 L83 160 L70 174 L80 178"/>
        <path d="M114 136 L122 160 L132 176 L146 176"/>
    </g>

    <g transform="rotate(6 100 90)">
        <defs>
            <mask id="lines" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
                <rect x="0" y="0" width="200" height="200" fill="#fff"/>
                <g stroke="#000" stroke-width="9" stroke-linecap="round">
                    <line x1="78" y1="80" x2="124" y2="80"/>
                    <line x1="78" y1="100" x2="124" y2="100"/>
                    <line x1="78" y1="120" x2="106" y2="120"/>
                </g>
            </mask>
        </defs>
        <!-- arms -->
        <g fill="none" stroke="#1F2A44" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
            <path d="M66 88 L48 104 L40 97"/>
            <path d="M136 88 L156 100 L166 91"/>
        </g>
        <!-- page with cut corner and knocked-out text lines -->
        <path d="M70 30 H110 V50 a10 10 0 0 0 10 10 H140 V132 a8 8 0 0 1 -8 8 H70 a8 8 0 0 1 -8 -8 V38 a8 8 0 0 1 8 -8 Z"
              fill="#1F2A44" mask="url(#lines)"/>
        <!-- folded corner -->
        <path d="M118 30 L140 52 H122 a4 4 0 0 1 -4 -4 Z" fill="#1F2A44"/>
    </g>
</svg>
[package]
name = "docgait-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
dirs = "6"
dunce = "1"
globset = "0.4"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
file-id = "0.2"

[dev-dependencies]
tempfile = "3"
